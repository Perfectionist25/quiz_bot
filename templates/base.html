<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>{% block title %}QuizzBot{% endblock %}</title>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="brand" href="/">QuizzBot Web</a>
        <nav class="top-nav">
          {% for item in menu %}
          <a href="{{ item.href }}">{{ item.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main class="main-content">
      <div class="page-shell">
        {% if message %}
        <div class="alert">{{ message }}</div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <span>QuizzBot Web — веб-версия вашего тестового бота</span>
      </div>
    </footer>
  </body>
</html>
